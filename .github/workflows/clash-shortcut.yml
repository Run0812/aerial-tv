name: Clash shortcut test APK

on:
  push:
    branches: [feat/clash-meta-shortcut]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shortcut-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit tests for both launcher variants
        run: |
          chmod +x gradlew
          ./gradlew :app:testStandardDebugUnitTest :app:testGuardDebugUnitTest --stacktrace
      - name: Restore persistent test signing key
        env:
          TEST_KEYSTORE: ${{ secrets.SHORTCUT_TEST_KEYSTORE }}
        run: |
          test -n "$TEST_KEYSTORE" || { echo 'Missing SHORTCUT_TEST_KEYSTORE secret'; exit 1; }
          mkdir -p local
          printf '%s' "$TEST_KEYSTORE" | base64 --decode > local/shortcut-test.p12
          cat > local/signing.properties <<'EOF'
          storeFile=shortcut-test.p12
          storePassword=aerial-test-only
          keyAlias=aerial-test
          keyPassword=aerial-test-only
          EOF
      - name: Build isolated release APK
        run: ./gradlew -PshortcutTest :app:assembleGuardRelease --stacktrace
      - name: Package APK and dex metadata
        run: |
          mkdir -p artifacts
          APK=app/build/outputs/apk/guard/release/app-guard-release.apk
          cp "$APK" artifacts/aerial-shortcuts-test.apk
          unzip -p "$APK" assets/aerial-dm/28.dm > artifacts/aerial-shortcuts-test-api28.dm
          unzip -p "$APK" assets/aerial-dm/31.dm > artifacts/aerial-shortcuts-test-api31.dm
          cp docs/CLASH_SHORTCUT_TEST.md artifacts/README.md
          (cd artifacts && sha256sum *.apk *.dm > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: aerial-shortcuts-test
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shortcut-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*
          if-no-files-found: ignore
      - name: Remove signing material
        if: always()
        run: rm -f local/shortcut-test.p12 local/signing.properties
