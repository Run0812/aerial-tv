name: Clash shortcut test APK

on:
  push:
    branches: [verify/quick-controls-pr]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shortcut-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit tests for both launcher variants
        run: |
          chmod +x gradlew
          ./gradlew :app:testStandardDebugUnitTest :app:testGuardDebugUnitTest :app:lintStandardRelease :app:lintGuardRelease --stacktrace
      - name: Restore persistent test signing key
        env:
          TEST_KEYSTORE: ${{ secrets.SHORTCUT_TEST_KEYSTORE }}
        run: |
          test -n "$TEST_KEYSTORE" || { echo 'Missing SHORTCUT_TEST_KEYSTORE secret'; exit 1; }
          mkdir -p local
          printf '%s' "$TEST_KEYSTORE" | base64 --decode > local/shortcut-test.p12
          cat > local/signing.properties <<'EOF'
          storeFile=shortcut-test.p12
          storePassword=aerial-test-only
          keyAlias=aerial-test
          keyPassword=aerial-test-only
          EOF
      - name: Build isolated release APK
        run: ./gradlew -PshortcutTest :app:assembleGuardRelease --stacktrace
      - name: Package APK and dex metadata
        run: |
          mkdir -p artifacts
          APK=app/build/outputs/apk/guard/release/app-guard-release.apk
          apkanalyzer manifest print "$APK" > artifacts/AndroidManifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('artifacts/AndroidManifest.xml').getroot()
          a = '{http://schemas.android.com/apk/res/android}'
          assert root.get('package') == 'app.orchard.tv.shortcuts', 'Unexpected application ID'
          forbidden = {'WRITE_SECURE_SETTINGS', 'WRITE_SETTINGS', 'SYSTEM_ALERT_WINDOW',
                       'RECEIVE_BOOT_COMPLETED', 'READ_SYNC_SETTINGS', 'WRITE_SYNC_SETTINGS',
                       'GET_ACCOUNTS', 'AUTHENTICATE_ACCOUNTS'}
          for item in root.findall('uses-permission'):
              assert item.get(a + 'name').split('.')[-1] not in forbidden, 'System integration permission present'
          app = root.find('application')
          for tag in ('service', 'receiver'):
              for item in app.findall(tag):
                  assert not item.get(a + 'name', '').startswith('app.orchard.tv.guard.'), 'Guard component present'
                  assert item.get(a + 'name') != 'app.orchard.tv.dream.AerialDream', 'System dream present'
          for item in app.iter('category'):
              assert item.get(a + 'name') not in {'android.intent.category.HOME', 'android.intent.category.HOME.CC'}, 'HOME handler present'
          assert app.find('provider').get(a + 'authorities') == 'app.orchard.tv.shortcuts.files', 'Shared FileProvider authority'
          print('Test APK isolation checks passed')
          PY
          cp "$APK" artifacts/aerial-shortcuts-test.apk
          unzip -p "$APK" assets/aerial-dm/28.dm > artifacts/aerial-shortcuts-test-api28.dm
          unzip -p "$APK" assets/aerial-dm/31.dm > artifacts/aerial-shortcuts-test-api31.dm
          cp docs/QUICK_CONTROLS.md artifacts/README.md
          (cd artifacts && sha256sum *.apk *.dm > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: aerial-shortcuts-test
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shortcut-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*
          if-no-files-found: ignore
      - name: Remove signing material
        if: always()
        run: rm -f local/shortcut-test.p12 local/signing.properties
